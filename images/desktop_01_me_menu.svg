  </g>
      
  <g>
    <rect x="230" y="151" width="260" height="26" rx="13" fill="#EEF3F8" stroke="#0A66C2"/>
    <text x="244" y="169" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#004182">② Then click “View Profile”</text>
  </g>
      <path d="M490 100 L580 70" stroke="#0A66C2" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
      <path d="M490 165 L580 160" stroke="#0A66C2" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    </g>

    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#0A66C2"/>
