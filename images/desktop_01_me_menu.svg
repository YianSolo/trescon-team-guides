    <g>
      
  <circle cx="672" cy="28" r="12" fill="#94A3B8"/>
  <text x="672" y="31.36" font-family="Arial, sans-serif" font-size="10.8" font-weight="700" fill="white" text-anchor="middle">Y</text>
      <text x="672" y="50" font-family="Arial, sans-serif" font-size="11" fill="#1B1F23" font-weight="700" text-anchor="middle">Me ▾</text>
      
  <!-- Halo painted first so it sits behind the dashed ring. -->
  <circle cx="672" cy="28" r="22" fill="#0A66C2" opacity="0">
    <animate attributeName="r" values="22;30;36" dur="2.6s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0 0.2 1; 0.2 0 0.2 1" keyTimes="0;0.55;1"/>
    <animate attributeName="opacity" values="0.16;0.05;0" dur="2.6s" begin="0s" repeatCount="indefinite" keyTimes="0;0.5;1"/>
  </circle>
  <circle cx="672" cy="28" r="22" fill="none" stroke="#0A66C2" stroke-width="2.4" stroke-dasharray="4 3">
    <animate attributeName="r" values="22;24.5;22" dur="2.6s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0;0.5;1"/>
    <animate attributeName="opacity" values="0.65;1;0.65" dur="2.6s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0;0.5;1"/>
    <animate attributeName="stroke-dashoffset" values="0;14" dur="14s" begin="0s" repeatCount="indefinite"/>
  </circle>
